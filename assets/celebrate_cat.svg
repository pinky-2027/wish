<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="catBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7597" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff7597" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597"/>
      <stop offset="100%" stop-color="#f0438c"/>
    </linearGradient>
    <filter id="catGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ff7597" flood-opacity="0.2"/>
    </filter>
  </defs>

  <style>
    @keyframes catBop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes heartPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    @keyframes earTwitch {
      0%, 90%, 100% { transform: rotate(0deg); }
      95% { transform: rotate(-6deg); }
    }
    .bop-group {
      animation: catBop 2s ease-in-out infinite;
    }
    .heart-anim {
      transform-origin: 60px 88px;
      animation: heartPulse 1.2s ease-in-out infinite;
    }
    .ear-twitch-anim {
      transform-origin: 32px 30px;
      animation: earTwitch 3s ease-in-out infinite;
    }
  </style>

  <g class="bop-group">
    <!-- Cat Ears -->
    <polygon class="ear-twitch-anim" points="26,18 42,42 20,40" fill="#f8edeb" stroke="#ffb6c1" stroke-width="2"/>
    <polygon class="ear-twitch-anim" points="27,24 38,40 22,39" fill="#ffccd5"/>

    <polygon points="94,18 78,42 100,40" fill="#f8edeb" stroke="#ffb6c1" stroke-width="2"/>
    <polygon points="93,24 82,40 98,39" fill="#ffccd5"/>

    <!-- Cat Head -->
    <circle cx="60" cy="54" r="34" fill="#ffffff" stroke="#ffccd5" stroke-width="2" filter="url(#catGlow)"/>

    <!-- Cheeks Blush -->
    <circle cx="40" cy="58" r="8" fill="url(#catBlush)"/>
    <circle cx="80" cy="58" r="8" fill="url(#catBlush)"/>

    <!-- Happy Eyes (^ ^) -->
    <path d="M 42 50 Q 48 44 54 50" fill="none" stroke="#5a3d46" stroke-width="3" stroke-linecap="round"/>
    <path d="M 66 50 Q 72 44 78 50" fill="none" stroke="#5a3d46" stroke-width="3" stroke-linecap="round"/>

    <!-- Nose & Mouth -->
    <polygon points="58,55 62,55 60,57" fill="#ff7597"/>
    <path d="M 55 58 Q 58 62 60 58 Q 62 62 65 58" fill="none" stroke="#5a3d46" stroke-width="2" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="28" y1="54" x2="16" y2="52" stroke="#ffb6c1" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="58" x2="16" y2="60" stroke="#ffb6c1" stroke-width="2" stroke-linecap="round"/>
    <line x1="92" y1="54" x2="104" y2="52" stroke="#ffb6c1" stroke-width="2" stroke-linecap="round"/>
    <line x1="92" y1="58" x2="104" y2="60" stroke="#ffb6c1" stroke-width="2" stroke-linecap="round"/>

    <!-- Paws holding big birthday heart -->
    <g class="heart-anim">
      <!-- Heart -->
      <path d="M 60 76 C 54 68, 42 70, 42 80 C 42 90, 60 102, 60 102 C 60 102, 78 90, 78 80 C 78 70, 66 68, 60 76 Z" fill="url(#heartGrad)"/>
      <ellipse cx="50" cy="76" rx="4" ry="2" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Little Paws resting on heart -->
    <ellipse cx="44" cy="80" rx="6" ry="5" fill="#ffffff" stroke="#ffccd5" stroke-width="1.5"/>
    <ellipse cx="76" cy="80" rx="6" ry="5" fill="#ffffff" stroke="#ffccd5" stroke-width="1.5"/>
  </g>
</svg>
