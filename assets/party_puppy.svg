<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="puppyBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7597" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff7597" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="partyHatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e"/>
      <stop offset="100%" stop-color="#fecfef"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ff7597" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    @keyframes earWiggleLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
    }
    @keyframes earWiggleRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }
    @keyframes puppyBlink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    @keyframes hatBob {
      0%, 100% { transform: translateY(0) rotate(8deg); }
      50% { transform: translateY(-4px) rotate(12deg); }
    }
    @keyframes sparkleSpin {
      0% { transform: scale(0.8) rotate(0deg); opacity: 0.5; }
      50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
      100% { transform: scale(0.8) rotate(360deg); opacity: 0.5; }
    }
    .ear-left-anim {
      transform-origin: 30px 45px;
      animation: earWiggleLeft 2s ease-in-out infinite;
    }
    .ear-right-anim {
      transform-origin: 90px 45px;
      animation: earWiggleRight 2s ease-in-out infinite 0.2s;
    }
    .eye-anim {
      transform-origin: 50% 64px;
      animation: puppyBlink 3.5s infinite;
    }
    .hat-anim {
      transform-origin: 60px 30px;
      animation: hatBob 2s ease-in-out infinite;
    }
    .sparkle-anim {
      transform-origin: 100px 25px;
      animation: sparkleSpin 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Dog Ears (Floppy cute puppy ears matching the photo filter) -->
  <!-- Left Ear -->
  <g class="ear-left-anim">
    <ellipse cx="25" cy="50" rx="14" ry="24" fill="#a47148" transform="rotate(-15 25 50)"/>
    <ellipse cx="25" cy="50" rx="9" ry="16" fill="#f7c59f" transform="rotate(-15 25 50)"/>
  </g>
  <!-- Right Ear -->
  <g class="ear-right-anim">
    <ellipse cx="95" cy="50" rx="14" ry="24" fill="#a47148" transform="rotate(15 95 50)"/>
    <ellipse cx="95" cy="50" rx="9" ry="16" fill="#f7c59f" transform="rotate(15 95 50)"/>
  </g>

  <!-- Puppy Head -->
  <ellipse cx="60" cy="68" rx="38" ry="34" fill="#f5ebe0" filter="url(#softGlow)"/>
  <!-- Brown patch around eye (cute beagle/puppy style) -->
  <path d="M 40 45 C 52 42, 60 55, 54 70 C 48 80, 32 75, 30 62 Z" fill="#d4a373" opacity="0.6"/>

  <!-- Cheeks Blush -->
  <circle cx="36" cy="74" r="9" fill="url(#puppyBlush)"/>
  <circle cx="84" cy="74" r="9" fill="url(#puppyBlush)"/>

  <!-- Eyes -->
  <g class="eye-anim">
    <!-- Left Eye -->
    <ellipse cx="44" cy="65" rx="5" ry="6" fill="#2b2d42"/>
    <circle cx="42" cy="63" r="2" fill="#ffffff"/>
    <circle cx="45" cy="67" r="1" fill="#ffffff"/>

    <!-- Right Eye (Cute Wink or Twinkle) -->
    <ellipse cx="76" cy="65" rx="5" ry="6" fill="#2b2d42"/>
    <circle cx="74" cy="63" r="2" fill="#ffffff"/>
    <circle cx="77" cy="67" r="1" fill="#ffffff"/>
  </g>

  <!-- Cute Puppy Snout & Nose -->
  <ellipse cx="60" cy="76" rx="14" ry="10" fill="#ffffff"/>
  <!-- Nose (rounded triangle) -->
  <path d="M 55 72 C 55 70, 65 70, 65 72 C 65 76, 61 78, 60 78 C 59 78, 55 76, 55 72 Z" fill="#2b2d42"/>
  <ellipse cx="58" cy="72" rx="2" ry="1" fill="#ffffff" opacity="0.8"/>
  <!-- Mouth W-shape -->
  <path d="M 54 78 Q 57 82 60 78 Q 63 82 66 78" fill="none" stroke="#2b2d42" stroke-width="2" stroke-linecap="round"/>
  <!-- Little Tongue sticking out -->
  <path d="M 58 80 Q 60 85 62 80 Z" fill="#ff7597"/>

  <!-- Birthday Party Hat -->
  <g class="hat-anim">
    <polygon points="60,6 44,38 76,38" fill="url(#partyHatGrad)" stroke="#ff7597" stroke-width="1.5"/>
    <!-- Hat stripes -->
    <path d="M 48 30 Q 60 26 72 30" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M 52 20 Q 60 17 68 20" fill="none" stroke="#ffd166" stroke-width="2.5"/>
    <!-- Pom-pom on top -->
    <circle cx="60" cy="5" r="5" fill="#ffd166"/>
  </g>

  <!-- Sparkles -->
  <g class="sparkle-anim">
    <path d="M 100 20 Q 100 25 105 25 Q 100 25 100 30 Q 100 25 95 25 Q 100 25 100 20 Z" fill="#ffd166"/>
  </g>
</svg>
